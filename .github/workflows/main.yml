name: Sync upstream  

on:
  schedule:
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/cv-cat/Spider_XHS.git

      - name: Fetch upstream
        run: |
          git fetch upstream master

      - name: Sync upstream
        run: |
          git merge --no-edit upstream/master

      - name: Push changes
        run: |
          git push origin master

      - name: Update http-api
        run: |
          git fetch origin http-api
          git checkout -B http-api origin/http-api
          git merge --no-edit master
          git push origin http-api
